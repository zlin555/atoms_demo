name: Deploy Backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "atoms-backend/**"
      - ".github/workflows/deploy-hf-backend.yml"
  workflow_dispatch:

jobs:
  sync-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Push atoms-backend to existing Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          set -e
          test -n "$HF_TOKEN"
          test -n "$HF_SPACE_ID"
          test -n "$HF_USERNAME"

          mkdir -p /tmp/hf-space
          cp -R atoms-backend/. /tmp/hf-space/
          cd /tmp/hf-space

          git init
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "Deploy backend from GitHub Actions"
          git branch -M main
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}"
          git push --force space main
